<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <!-- Busca: Photon + Search -->
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <!-- Geocoder plugin -->
        <link rel="stylesheet" href="css/leaflet-control-geocoder.Geocoder.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .map-logo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 80px;
            opacity: 0.8;
            z-index: 1000;
            pointer-events: none;
        }
        </style>
        <title>Áreas de Propriedades Aderidas ao Programa PSA</title>
    </head>
    <body>
        <div id="map">
            <img class="map-logo" src="images/LOGOPSA.png" alt="Logo PSA">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <!-- Busca: Photon + Search -->
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-search.js"></script>
        <!-- Geocoder plugin -->
        <script src="js/leaflet-control-geocoder.Geocoder.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/RioCubato_2.js"></script>
        <script src="data/LotesRurais_3.js"></script>
        <script src="data/LimitedoPrograma_4.js"></script>
        <script src="data/reasaderidasaoPSA_5.js"></script>
        <script>
        var map = L.map('map', { zoomControl:false, maxZoom:28, minZoom:4 })
            .fitBounds([[-26.195366156434243,-49.01010106908575],[-26.145736203566944,-48.917806403479744]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix(
            '<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; ' +
            '<a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; ' +
            '<a href="https://qgis.org">QGIS</a>'
        );
        var autolinker = new Autolinker({truncate:{length:30,location:'smart'}});

        function removeEmptyRowsFromPopupContent(content, feature) {
            var temp = document.createElement('div'); temp.innerHTML = content;
            temp.querySelectorAll('tr').forEach(function(row){
                var td = row.querySelector('td.visible-with-data');
                if(td && feature.properties[td.id]==null) row.remove();
            });
            return temp.innerHTML;
        }
        function addClassToPopupIfMedia(content, popup){
            var tmp = document.createElement('div'); tmp.innerHTML = content;
            if(tmp.querySelector('td img')) {
                popup._contentNode.classList.add('media');
                setTimeout(function(){popup.update();},10);
            } else popup._contentNode.classList.remove('media');
        }

        var title = new L.Control({position:'topright'});
        title.onAdd = function(){ this._div=L.DomUtil.create('div','info'); this.update(); return this._div; };
        title.update = function(){ this._div.innerHTML='<h2>Áreas de Propriedades Aderidas ao Programa PSA</h2>'; };
        title.addTo(map);

        L.control.zoom({position:'topleft'}).addTo(map);
        var measure = new L.Control.Measure({position:'topleft',primaryLengthUnit:'meters',secondaryLengthUnit:'kilometers',primaryAreaUnit:'sqmeters',secondaryAreaUnit:'hectares'}).addTo(map);
        var btn = document.getElementsByClassName('leaflet-control-measure-toggle')[0]; btn.innerHTML=''; btn.className+=' fas fa-ruler';

        var bounds_group = new L.featureGroup([]);
        function setBounds(){}

        // Cria panes com blend-mode
        ['RioCubato_2','LotesRurais_3','LimitedoPrograma_4','reasaderidasaoPSA_5'].forEach(function(name,i){
            var pane='pane_'+name;
            map.createPane(pane);
            map.getPane(pane).style.zIndex=402+i;
            map.getPane(pane).style['mix-blend-mode']='normal';
        });

        // Camadas e popups (exemplo: RioCubato)
        function pop_RioCubato_2(f,l){ var t='<table>'+
            '<tr><td colspan=2>'+(f.properties['fid']||'')+'</td></tr>'+  
            '<tr><td colspan=2>'+(f.properties['objectid']||'')+'</td></tr>'+  
            '<tr><td colspan=2>'+(f.properties['nome']||'')+'</td></tr>'+  
            '<tr><td colspan=2>'+(f.properties['regime']||'')+'</td></tr></table>';
            var c=removeEmptyRowsFromPopupContent(t,f);
            l.on('popupopen',function(e){addClassToPopupIfMedia(c,e.popup);});
            l.bindPopup(c,{maxHeight:400});
        }
        var layer_RioCubato_2=new L.geoJson(json_RioCubato_2,{pane:'pane_RioCubato_2',interactive:false,onEachFeature:pop_RioCubato_2}); bounds_group.addLayer(layer_RioCubato_2); map.addLayer(layer_RioCubato_2);

        // ... Demais camadas (LotesRurais_3, LimitedoPrograma_4, reasaderidasaoPSA_5) seguem lógica semelhante ...

        // Árvore de camadas
        var overlays = [
            {label:'<img src="legend/RioCubato_2.png" /> Rio Cubatão',layer:layer_RioCubato_2},
            {label:'<img src="legend/LotesRurais_3.png" /> Lotes Rurais',layer:layer_LotesRurais_3},
            {label:'<img src="legend/LimitedoPrograma_4.png" /> Limite do Programa',layer:layer_LimitedoPrograma_4},
            {label:'<img src="legend/reasaderidasaoPSA_5.png" /> Áreas aderidas ao PSA',layer:layer_reasaderidasaoPSA_5},
            {label:'Positron',layer:layer_Positron_1,radioGroup:'bm'},
            {label:'Google Satellite',layer:layer_GoogleSatellite_0,radioGroup:'bm'}
        ];
        L.control.layers.tree(null,overlays,{collapsed:true}).addTo(map);

        // Controle de busca: Photon/Search
        map.addControl(new L.Control.Search({layer:layer_reasaderidasaoPSA_5,propertyName:'iq_lote',initial:false,hideMarkerOnCollapse:true}));

        // Controlo de geocoding
        var osmGeocoder = new L.Control.Geocoder({collapsed:true,position:'topleft',placeholder:'Search...'}).addTo(map);
        document.getElementsByClassName('leaflet-control-geocoder-icon')[0].className+=' fa fa-search';

        setBounds();
        // Eventos de reset labels
        map.on('zoomend layeradd layerremove', function(){ resetLabels([layer_LotesRurais_3,layer_reasaderidasaoPSA_5]); });
        </script>
    </body>
</html>
