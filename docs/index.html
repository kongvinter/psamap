<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .map-logo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 80px;
            opacity: 0.8;
            z-index: 1000;
            pointer-events: none;
        }
        </style>
        <title>Propriedades Aderidas ao Programa Águas Para Sempre</title>
    </head>
    <body>
        <div id="map">
            <img class="map-logo" src="images/LOGOPSA.png" alt="Logo PSA">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/RioCubato_2.js"></script>
        <script src="data/LotesRurais_3.js"></script>
        <script src="data/LimitedoPrograma_4.js"></script>
        <script src="data/reasaderidasaoPSA_5.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:4
        }).fitBounds([[-26.265406247249036,-49.24408297450744],[-26.066879068062082,-48.87490431208342]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var title = new L.Control({'position':'topright'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Áreas de Propriedades Aderidas ao Programa PSA</h2>';
        };
        title.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleSatellite_0');
        map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
        var layer_GoogleSatellite_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_0',
            opacity: 1.0,
            attribution: '<a href="https://www.google.at/permissions/geoguidelines/attr-guide.html">Map data ©2015 Google</a>',
            minZoom: 4,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_GoogleSatellite_0;
        map.addLayer(layer_GoogleSatellite_0);
        map.createPane('pane_Positron_1');
        map.getPane('pane_Positron_1').style.zIndex = 401;
        var layer_Positron_1 = L.tileLayer('https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
            pane: 'pane_Positron_1',
            opacity: 1.0,
            attribution: '<a href="https://cartodb.com/basemaps/">Map tiles by CartoDB, under CC BY 3.0. Data by OpenStreetMap, under ODbL.</a>',
            minZoom: 4,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_Positron_1;
        map.addLayer(layer_Positron_1);
        function pop_RioCubato_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['objectid'] !== null ? autolinker.link(String(feature.properties['objectid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['nome'] !== null ? autolinker.link(String(feature.properties['nome']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['regime'] !== null ? autolinker.link(String(feature.properties['regime']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_RioCubato_2_0() {
            return {
                pane: 'pane_RioCubato_2',
                interactive: false,
            }
        }
        map.createPane('pane_RioCubato_2');
        map.getPane('pane_RioCubato_2').style.zIndex = 402;
        map.getPane('pane_RioCubato_2').style['mix-blend-mode'] = 'normal';
        var layer_RioCubato_2 = new L.geoJson(json_RioCubato_2, {
            attribution: '',
            interactive: false,
            dataVar: 'json_RioCubato_2',
            layerName: 'layer_RioCubato_2',
            pane: 'pane_RioCubato_2',
            onEachFeature: pop_RioCubato_2,
            style: style_RioCubato_2_0,
        });
        bounds_group.addLayer(layer_RioCubato_2);
        map.addLayer(layer_RioCubato_2);
        function pop_LotesRurais_3(feature, layer) {
            var popupContent = '<table>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_LotesRurais_3_0() {
            return {
                pane: 'pane_LotesRurais_3',
                opacity: 1,
                color: 'rgba(117,117,117,0.49019607843137253)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_LotesRurais_3');
        map.getPane('pane_LotesRurais_3').style.zIndex = 403;
        map.getPane('pane_LotesRurais_3').style['mix-blend-mode'] = 'normal';
        var layer_LotesRurais_3 = new L.geoJson(json_LotesRurais_3, {
            attribution: '',
            interactive: false,
            dataVar: 'json_LotesRurais_3',
            layerName: 'layer_LotesRurais_3',
            pane: 'pane_LotesRurais_3',
            onEachFeature: pop_LotesRurais_3,
            style: style_LotesRurais_3_0,
        });
        bounds_group.addLayer(layer_LotesRurais_3);
        map.addLayer(layer_LotesRurais_3);
        function pop_LimitedoPrograma_4(feature, layer) {
            var popupContent = '<table>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_LimitedoPrograma_4_0() {
            return {
                pane: 'pane_LimitedoPrograma_4',
                opacity: 1,
                color: 'rgba(175,12,24,1.0)',
                dashArray: '3.0,6.0',
                lineCap: 'square',
                lineJoin: 'miter',
                weight: 3.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_LimitedoPrograma_4');
        map.getPane('pane_LimitedoPrograma_4').style.zIndex = 404;
        map.getPane('pane_LimitedoPrograma_4').style['mix-blend-mode'] = 'normal';
        var layer_LimitedoPrograma_4 = new L.geoJson(json_LimitedoPrograma_4, {
            attribution: '',
            interactive: false,
            dataVar: 'json_LimitedoPrograma_4',
            layerName: 'layer_LimitedoPrograma_4',
            pane: 'pane_LimitedoPrograma_4',
            onEachFeature: pop_LimitedoPrograma_4,
            style: style_LimitedoPrograma_4_0,
        });
        bounds_group.addLayer(layer_LimitedoPrograma_4);
        map.addLayer(layer_LimitedoPrograma_4);
        function pop_reasaderidasaoPSA_5(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">iq_lote</th>\
                        <td class="visible-with-data" id="iq_lote">' + (feature.properties['iq_lote'] !== null ? autolinker.link(String(feature.properties['iq_lote']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td class="visible-with-data" id="car" colspan="2"><strong>car</strong><br />' + (feature.properties['car'] !== null ? autolinker.link(String(feature.properties['car']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['link_pdf'] !== null ? autolinker.link(String(feature.properties['link_pdf']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_reasaderidasaoPSA_5_0() {
            return {
                pane: 'pane_reasaderidasaoPSA_5',
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 2.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        function style_reasaderidasaoPSA_5_1() {
            return {
                pane: 'pane_reasaderidasaoPSA_5',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(57,80,255,0.7686274509803922)',
                interactive: true,
            }
        }
        map.createPane('pane_reasaderidasaoPSA_5');
        map.getPane('pane_reasaderidasaoPSA_5').style.zIndex = 405;
        map.getPane('pane_reasaderidasaoPSA_5').style['mix-blend-mode'] = 'normal';
        var layer_reasaderidasaoPSA_5 = new L.geoJson.multiStyle(json_reasaderidasaoPSA_5, {
            attribution: '',
            interactive: true,
            dataVar: 'json_reasaderidasaoPSA_5',
            layerName: 'layer_reasaderidasaoPSA_5',
            pane: 'pane_reasaderidasaoPSA_5',
            onEachFeature: pop_reasaderidasaoPSA_5,
            styles: [style_reasaderidasaoPSA_5_0,style_reasaderidasaoPSA_5_1,]
        });
        bounds_group.addLayer(layer_reasaderidasaoPSA_5);
        map.addLayer(layer_reasaderidasaoPSA_5);
        var overlaysTree = [
            {label: '<img src="legend/reasaderidasaoPSA_5.png" /> Áreas aderidas ao PSA', layer: layer_reasaderidasaoPSA_5},
            {label: '<img src="legend/LimitedoPrograma_4.png" /> Limite do Programa', layer: layer_LimitedoPrograma_4},
            {label: '<img src="legend/LotesRurais_3.png" /> Lotes Rurais', layer: layer_LotesRurais_3},
            {label: '<img src="legend/RioCubato_2.png" /> Rio Cubatão', layer: layer_RioCubato_2},
            {label: "Positron", layer: layer_Positron_1, radioGroup: 'bm' },
            {label: "Google Satellite", layer: layer_GoogleSatellite_0, radioGroup: 'bm' },]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        map.addControl(new L.Control.Search({
            layer: layer_reasaderidasaoPSA_5,
            initial: false,
            hideMarkerOnCollapse: true,
            propertyName: 'iq_lote'}));
        if (typeof url === 'undefined') {
            document.getElementsByClassName('search-button')[0].className += ' fa fa-binoculars';
        } else {
            document.getElementsByClassName('search-button')[1].className += ' fa fa-binoculars';
        }
        resetLabels([layer_LotesRurais_3,layer_reasaderidasaoPSA_5]);
        map.on("zoomend", function(){
            resetLabels([layer_LotesRurais_3,layer_reasaderidasaoPSA_5]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_LotesRurais_3,layer_reasaderidasaoPSA_5]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_LotesRurais_3,layer_reasaderidasaoPSA_5]);
        });
        </script>
    </body>
</html>
